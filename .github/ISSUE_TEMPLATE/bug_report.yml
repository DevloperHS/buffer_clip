name: 🐞 Report a bug
description: Something doesn't work the way it should. Plain words are perfect.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to tell us! Fill in what you can. There are no wrong answers.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem in your own words.
      placeholder: "When I clicked Export, the video had a white line at the bottom."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do just before?
      description: List the steps, one per line, so we can try it ourselves.
      placeholder: |
        1. Recorded a tab with sound on
        2. Opened it in the editor
        3. Clicked Export
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "A clean video with sound."
  - type: textarea
    id: media
    attributes:
      label: Screenshot or video
      description: Drag and drop an image or a short video here. It helps a lot!
  - type: dropdown
    id: browser
    attributes:
      label: Which browser were you using?
      options:
        - Chrome
        - Edge
        - Other
        - Not sure
